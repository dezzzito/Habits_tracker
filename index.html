<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#2d3748;--mut:#8792a8;--bd:#e2e6ee;--card:#fff;--cell:#eef0f6;--g:#19c39a;--grid:rgba(0,0,0,.035);--warn:#fffbe6;--warnb:#f0e2a0;--red:#f0616d}
[data-theme=dark]{--bg:#12151c;--fg:#e6e9f0;--mut:#7e889c;--bd:#2a3040;--card:#171b24;--cell:#222836;--grid:rgba(255,255,255,.03);--warn:#2a2614;--warnb:#4d4420}
*{box-sizing:border-box}
body{margin:0;font:500 16px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px;padding:24px 12px}
nav a{display:flex;align-items:center;gap:8px;color:var(--mut);text-decoration:none;font-weight:600}
nav a.on{color:var(--fg)}nav a.on svg{color:var(--g)}
nav svg{width:16px;height:16px;fill:currentColor}
main{max-width:1002px;margin:0 auto;padding:0 16px 40px}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:10px 12px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.tb{display:flex;gap:16px;margin:16px 0 40px;flex-wrap:wrap}
.sb{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:0 12px}
.sb input{flex:1;border:0;background:none;outline:0;padding:11px 0;min-width:0}
.sb span{color:var(--mut)}.sb kbd{font-size:11px;background:var(--cell);color:var(--mut);padding:2px 6px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:32px;margin-bottom:38px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.ch h2{margin:0;font-size:24px;font-weight:700;overflow-wrap:anywhere}
.ic{display:flex;align-items:center;gap:4px}
.ib{background:none;border:0;color:var(--mut);cursor:pointer;padding:4px 8px;font-size:16px}
.dd{position:relative}.dd summary{list-style:none;cursor:pointer;padding:4px 8px;color:var(--mut)}
.dd summary::-webkit-details-marker{display:none}
.dd div{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--bd);border-radius:6px;z-index:5;display:flex;flex-direction:column;min-width:130px;overflow:hidden}
.dd button{background:none;border:0;padding:10px 14px;text-align:left;cursor:pointer}.dd button:hover{background:var(--cell)}
.hw{overflow-x:auto;padding-bottom:6px}
.hi{display:inline-block;min-width:100%}
.ml{display:grid;grid-auto-flow:column;grid-auto-columns:12px;gap:5px;height:20px;margin-left:44px;font-size:12px;color:var(--fg)}
.ml span{white-space:nowrap}
.bd{display:flex}
.dl{display:grid;grid-template-rows:repeat(7,12px);gap:5px;width:44px;font-size:12px;line-height:12px}
.cells{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:5px}
.c{display:block;width:12px;height:12px;border-radius:2px;background:var(--cell)}
[data-d]{cursor:pointer}
.c.on{background:var(--c,var(--g))}
.c.l1{background:color-mix(in srgb,var(--g) 30%,var(--cell))}
.c.l2{background:color-mix(in srgb,var(--g) 55%,var(--cell))}
.c.l3{background:color-mix(in srgb,var(--g) 78%,var(--cell))}
.c.l4{background:var(--g)}
.c.f{visibility:hidden}
.c.t{outline:1.5px solid var(--fg)}
.lt{display:flex;justify-content:flex-end;margin-top:22px}
.lt .btn{font-weight:600;padding:12px 14px}.lt .btn.ok{color:var(--g);border-color:var(--g)}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.ban{background:var(--warn);border:1px solid var(--warnb);border-radius:4px;padding:16px;margin:16px 0 40px}
.ph{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.av{width:96px;height:96px;border-radius:50%;background:#ffd84d;border:2px solid #111;display:grid;place-items:center;font-size:42px;font-weight:700;color:#111}
.pi{flex:1;min-width:180px;display:flex;flex-direction:column;justify-content:center}
.pi h1{margin:0 0 6px;font-size:30px}
.sc{flex:1;min-width:260px;max-width:384px;background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:12px;color:var(--mut);font-size:14px}
.sc svg{width:100%;height:70px;display:block;margin-top:8px;border-bottom:1px solid var(--bd)}
.set{max-width:450px;margin:0 auto}
.set h2{font-size:30px;margin:24px 0 20px}.set label{display:block;color:var(--mut);margin-bottom:6px}
.set textarea,.set select,.set input{width:100%;padding:11px 12px;background:var(--card);border:1px solid var(--bd);border-radius:4px}
.set p{color:var(--mut);font-size:14px}
.set textarea{resize:vertical;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--cell);border-radius:12px;padding:2px 10px;font-size:13px}.chip.off{color:var(--mut)}
.ent{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:12px;cursor:pointer}
.ent.cur{border-color:var(--g)}.ent b{text-transform:capitalize}
.ent p{color:var(--fg);font-size:16px;white-space:pre-wrap;margin:6px 0 0;overflow-wrap:anywhere}
dialog{border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);padding:24px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog input[type=text]{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;margin:6px 0 16px}
dialog input[type=color]{width:48px;height:36px;border:0;background:none;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
footer{text-align:center;color:var(--mut);padding:30px 0 50px}
@media(max-width:600px){.card{padding:18px}nav{gap:18px}.ch h2{font-size:20px}}
</style>
</head>
<body>
<nav>
 <a href="#habitos" data-v="habitos"><svg viewBox="0 0 16 16"><path d="M3 1h10a2 2 0 012 2v10a2 2 0 01-2 2H3a2 2 0 01-2-2V3a2 2 0 012-2zm7.3 4.3L7 8.6 5.7 7.3 4.6 8.4 7 10.8l4.4-4.4z"/></svg>Mis hábitos</a>
 <a href="#diario" data-v="diario"><svg viewBox="0 0 16 16"><path d="M1 2h5a2 2 0 012 2v10a2 2 0 00-2-2H1zM15 2h-5a2 2 0 00-2 2v10a2 2 0 012-2h5z"/></svg>Diario</a>
 <a href="#perfil" data-v="perfil"><svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3.2"/><path d="M2 15c0-3.3 2.7-5 6-5s6 1.7 6 5z"/></svg>Perfil</a>
 <a href="#ajustes" data-v="ajustes"><svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 5.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM7 0h2l.4 1.9 1.5.6 1.6-1.1 1.4 1.4-1.1 1.6.6 1.5L16 7v2l-1.9.4-.6 1.5 1.1 1.6-1.4 1.4-1.6-1.1-1.5.6L9 16H7l-.4-1.9-1.5-.6-1.6 1.1-1.4-1.4 1.1-1.6-.6-1.5L0 9V7l1.9-.4.6-1.5-1.1-1.6L2.8 2.1l1.6 1.1 1.5-.6z"/></svg>Ajustes</a>
</nav>
<main id="app"></main>
<footer>Hecho con <span style="color:#f472b6">♥</span></footer>
<dialog id="dlg">
 <form method="dialog" id="frm">
  <label for="nm">Nombre del hábito</label>
  <input type="text" id="nm" maxlength="60" placeholder="Ej. Leer 20 minutos" required>
  <div class="row"><label for="col">Color</label><input type="color" id="col" value="#19c39a"></div>
  <div class="row" style="margin-top:20px"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn" style="background:var(--g);color:#fff;border-color:var(--g)">Crear hábito</button></div>
 </form>
</dialog>
<script>
const K='habitos_v1',$=s=>document.querySelector(s);
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS=['Lun','','Mié','','Vie','',''];
let Q='',REORD=false;
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.habits)return d}catch(e){}
 return{habits:[],user:'Usuario',theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}})();
S.diary=S.diary||{};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};

// Mapa de calor: 53 semanas, lunes arriba. fn(k) devuelve la clase de cada celda.
function heat(fn,edit,hid,color){
 const t=today(),tk=key(t),start=new Date(t);
 start.setDate(t.getDate()-((t.getDay()+6)%7)-52*7);
 let cells='',lab='',pm=start.getMonth();
 for(let w=0;w<53;w++){
  const m=new Date(start);m.setDate(start.getDate()+w*7);
  if(m.getMonth()!==pm){pm=m.getMonth();lab+=`<span style="grid-column:${w+1}">${MES[pm]}</span>`}
  for(let d=0;d<7;d++){
   const x=new Date(start);x.setDate(start.getDate()+w*7+d);
   if(x>t){cells+='<i class="c f"></i>';continue}
   const k=key(x);
   cells+=`<i class="c ${fn(k)}${k===tk?' t':''}" title="${k}"${edit?` data-d="${k}" data-h="${hid}"`:''}></i>`;
  }
 }
 return`<div class="hw"><div class="hi"${color?` style="--c:${color}"`:''}><div class="ml">${lab}</div><div class="bd"><div class="dl">${DIAS.map(d=>`<span>${d}</span>`).join('')}</div><div class="cells">${cells}</div></div></div></div>`;
}
// Cumplimiento del día = hábitos hechos / hábitos que ya existían ese día
function pct(k){let a=0,d=0;for(const h of S.habits)if(h.created<=k){a++;if(h.dates[k])d++}return a?d/a:0}
const lvl=p=>p===0?'':p<=.25?'l1':p<=.5?'l2':p<=.75?'l3':'l4';

function card(h,edit){
 const done=!!h.dates[key(today())];
 const ctl=edit?`<div class="ic">${REORD?'<button class="ib" data-a="up">↑</button><button class="ib" data-a="dn">↓</button>':''}<details class="dd"><summary>⋮</summary><div><button data-a="ren">Renombrar</button><button data-a="del">Eliminar</button></div></details></div>`:'';
 return`<section class="card" data-id="${h.id}"><div class="ch"><h2>${esc(h.name)}</h2>${ctl}</div>${heat(k=>h.dates[k]?'on':'',edit,h.id,h.color)}${edit?`<div class="lt"><button class="btn${done?' ok':''}" data-a="today">${done?'✓ Hecho hoy':'Registrar hoy →'}</button></div>`:''}</section>`;
}
function list(){
 const q=Q.toLowerCase(),hs=S.habits.filter(h=>h.name.toLowerCase().includes(q));
 $('#list').innerHTML=hs.length?hs.map(h=>card(h,true)).join(''):`<div class="empty">${S.habits.length?'Ningún hábito coincide con la búsqueda.':'Aún no tienes hábitos. Crea el primero con “Crear hábito”.'}</div>`;
 scrollHM();
}
function scrollHM(){document.querySelectorAll('.hw').forEach(e=>e.scrollLeft=e.scrollWidth)}

function perfil(){
 const t=today();let days=0,pts=0,pts2=[];
 for(let i=364;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);pts2.push(pct(key(d)))}
 const set=new Set();S.habits.forEach(h=>Object.keys(h.dates).forEach(k=>{set.add(k);pts++}));days=set.size;
 const poly=pts2.map((p,i)=>`${i},${58-p*54}`).join(' ');
 return`<div class="ban">Esta es tu página de perfil. Tus datos se guardan en este dispositivo.</div>
 <div class="ph"><div class="av">${esc((S.user||'U')[0].toUpperCase())}</div><div class="pi"><h1>${esc(S.user)}</h1><div>${days} días registrados</div><div>${pts} puntos</div></div>
 <div class="sc">Puntaje diario (1 año):<svg viewBox="0 0 364 60" preserveAspectRatio="none"><polyline points="${poly}" fill="none" stroke="var(--g)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></div></div>
 <section class="card"><div class="ch"><h2>Cumplimiento diario</h2></div>${heat(k=>lvl(pct(k)),false)}</section>`+S.habits.map(h=>card(h,false)).join('');
}
function ajustes(){
 return`<div class="set"><h2>Apariencia</h2><label for="th">Modo claro / oscuro:</label>
 <select id="th"><option value="light">☀ Claro</option><option value="dark">☾ Oscuro</option></select>
 <h2>Detalles del perfil</h2><label for="un">Nombre de usuario:</label><input id="un" maxlength="30" value="${esc(S.user)}">
 <p>Tus hábitos se guardan solo en este navegador.</p></div>`;
}

let DK=key(today());
const done=k=>S.habits.filter(h=>h.dates[k]).map(h=>h.name);
const fd=k=>new Date(k+'T00:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const chips=k=>{const d=done(k);return d.length?d.map(n=>`<span class="chip">✓ ${esc(n)}</span>`).join(''):'<span class="chip off">Sin hábitos registrados</span>'};
function diario(){
 return`<div class="set" style="max-width:700px"><h2 style="margin-top:8px">Diario</h2>
 <label for="dt">Día</label><input type="date" id="dt" value="${DK}" max="${key(today())}">
 <div class="chips" id="chips"></div>
 <label for="tx" style="margin-top:16px">¿Cómo te fue este día?</label>
 <textarea id="tx" rows="6" placeholder="Escribe lo que quieras recordar de este día…">${esc(S.diary[DK]||'')}</textarea>
 <p id="st">Se guarda solo mientras escribes.</p>
 <h2>Entradas anteriores</h2><div id="ents"></div></div>`;
}
function ents(){
 $('#chips').innerHTML=chips(DK);
 const ks=Object.keys(S.diary).sort().reverse();
 $('#ents').innerHTML=ks.length?ks.map(k=>`<article class="ent${k===DK?' cur':''}" data-k="${k}"><b>${fd(k)}</b><div class="chips">${chips(k)}</div><p>${esc(S.diary[k])}</p></article>`).join(''):'<div class="empty">Aún no hay entradas. Escribe la de hoy.</div>';
}
function view(){
 const v=location.hash.slice(1)||'habitos';
 document.documentElement.dataset.theme=S.theme;
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
 const a=$('#app');
 if(v==='perfil'){a.innerHTML=perfil();scrollHM()}
 else if(v==='diario'){a.innerHTML=diario();ents()}
 else if(v==='ajustes'){a.innerHTML=ajustes();$('#th').value=S.theme}
 else{a.innerHTML=`<div class="tb"><label class="sb"><span>⌕</span><input id="q" placeholder="Buscar hábitos" value="${esc(Q)}"><kbd>Ctrl</kbd><kbd>K</kbd></label><button class="btn" data-a="reord">Reordenar ⇅</button><button class="btn" data-a="new">Crear hábito ▾</button></div><div id="list"></div>`;list()}
}
const find=id=>S.habits.find(h=>h.id===id);
function toggle(id,k){const h=find(id);if(h.dates[k])delete h.dates[k];else{h.dates[k]=1;if(k<h.created)h.created=k}save();list()}

$('#app').addEventListener('click',e=>{
 const en=e.target.closest('.ent');if(en){DK=en.dataset.k;view();return scrollTo(0,0)}
 const c=e.target.closest('.c[data-d]');if(c)return toggle(c.dataset.h,c.dataset.d);
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,sec=b.closest('.card'),id=sec&&sec.dataset.id,h=id&&find(id);
 if(a==='new'){$('#nm').value='';$('#dlg').showModal();$('#nm').focus()}
 else if(a==='reord'){REORD=!REORD;list()}
 else if(a==='today')toggle(id,key(today()));
 else if(a==='ren'){const n=prompt('Nuevo nombre del hábito',h.name);if(n&&n.trim()){h.name=n.trim().slice(0,60);save();list()}}
 else if(a==='del'){if(confirm(`¿Eliminar “${h.name}” y todo su historial?`)){S.habits=S.habits.filter(x=>x!==h);save();list()}}
 else if(a==='up'||a==='dn'){const i=S.habits.indexOf(h),j=a==='up'?i-1:i+1;if(S.habits[j]){[S.habits[i],S.habits[j]]=[S.habits[j],S.habits[i]];save();list()}}
});
$('#app').addEventListener('input',e=>{
 if(e.target.id==='q'){Q=e.target.value;list()}
 if(e.target.id==='un'){S.user=e.target.value.trim()||'Usuario';save()}
 if(e.target.id==='tx'){const v=e.target.value;if(v.trim())S.diary[DK]=v;else delete S.diary[DK];save();ents();$('#st').textContent='Guardado'}
});
$('#app').addEventListener('change',e=>{
 if(e.target.id==='th'){S.theme=e.target.value;save();document.documentElement.dataset.theme=S.theme}
 if(e.target.id==='dt'&&e.target.value){DK=e.target.value;view()}
});
$('#frm').addEventListener('submit',()=>{
 const n=$('#nm').value.trim();if(!n)return;
 S.habits.push({id:Date.now().toString(36),name:n,color:$('#col').value,created:key(today()),dates:{}});save();list();
});
$('#cx').onclick=()=>$('#dlg').close();
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){const q=$('#q');if(q){e.preventDefault();q.focus()}}});
addEventListener('hashchange',view);
view();
</script>
</body>
</html>
