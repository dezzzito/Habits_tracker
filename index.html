<style>
:root{--bg:#fff;--fg:#2d3748;--mut:#8792a8;--bd:#e2e6ee;--card:#fff;--cell:#eef0f6;--g:#19c39a;--grid:rgba(0,0,0,.035);--warn:#fffbe6;--warnb:#f0e2a0;--red:#f0616d;color-scheme:light;--dot:rgba(0,0,0,.08)}
[data-theme=dark]{--bg:#12151c;--fg:#e6e9f0;--mut:#7e889c;--bd:#2a3040;--card:#171b24;--cell:#222836;--grid:rgba(255,255,255,.03);--warn:#2a2614;--warnb:#4d4420;color-scheme:dark;--dot:rgba(255,255,255,.07)}
*{box-sizing:border-box}
body{margin:0;font:500 16px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background-color:var(--bg)}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px;padding:24px 12px}
nav a{display:flex;align-items:center;gap:8px;color:var(--mut);text-decoration:none;font-weight:600}
nav a.on{color:var(--fg)}nav a.on svg{color:var(--g)}
nav svg{width:16px;height:16px;fill:currentColor}
main{max-width:1002px;margin:0 auto;padding:0 16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:10px 12px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.tb{display:flex;gap:16px;margin:16px 0 40px;flex-wrap:wrap}
.sb{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:0 12px}
.sb input{flex:1;border:0;background:none;outline:0;padding:11px 0;min-width:0}
.sb span{color:var(--mut)}.sb kbd{font-size:11px;background:var(--cell);color:var(--mut);padding:2px 6px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:32px;margin-bottom:38px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.ch h2{margin:0;font-size:24px;font-weight:700;overflow-wrap:anywhere}
.ic{display:flex;align-items:center;gap:4px}
.ib{background:none;border:0;color:var(--mut);cursor:pointer;padding:4px 8px;font-size:16px}
.dd{position:relative}.dd summary{list-style:none;cursor:pointer;padding:4px 8px;color:var(--mut)}
.dd summary::-webkit-details-marker{display:none}
.dd div{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--bd);border-radius:6px;z-index:5;display:flex;flex-direction:column;min-width:130px;overflow:hidden}
.dd button{background:none;border:0;padding:10px 14px;text-align:left;cursor:pointer}.dd button:hover{background:var(--cell)}
.hw{overflow-x:auto;padding-bottom:6px}
.hi{display:inline-block;min-width:100%;padding:3px 4px 3px 0}
.ml{display:grid;grid-auto-flow:column;grid-auto-columns:12px;gap:5px;height:20px;margin-left:44px;font-size:12px;color:var(--fg)}
.ml span{white-space:nowrap}
.bd{display:flex}
.dl{display:grid;grid-template-rows:repeat(7,12px);gap:5px;width:44px;font-size:12px;line-height:12px}
.cells{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:5px}
.c{display:block;width:12px;height:12px;border-radius:2px;background:var(--cell)}
[data-d]{cursor:pointer}
.c.on{background:var(--c,var(--g))}
.c.l1{background:color-mix(in srgb,var(--g) 30%,var(--cell))}
.c.l2{background:color-mix(in srgb,var(--g) 55%,var(--cell))}
.c.l3{background:color-mix(in srgb,var(--g) 78%,var(--cell))}
.c.l4{background:var(--g)}
.c.f{visibility:hidden}
.c.t{outline:1.5px solid var(--fg)}
.lt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.st{font-size:14px;color:var(--mut)}.st b{color:var(--fg)}
.lt .btn{font-weight:600;padding:12px 14px;margin-left:auto}.lt .btn.ok{color:var(--g);border-color:var(--g)}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.ban{position:relative;background:var(--warn);border:1px solid var(--warnb);border-radius:4px;padding:16px 44px 16px 16px;margin:16px 0 24px}
.ph{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.av{width:96px;height:96px;border-radius:50%;background:#ffd84d;border:2px solid #111;display:grid;place-items:center;font-size:42px;font-weight:700;color:#111}
.pi{flex:1;min-width:180px;display:flex;flex-direction:column;justify-content:center}
.pi h1{margin:0 0 6px;font-size:30px}
.sc{flex:1;min-width:260px;max-width:384px;background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:12px;color:var(--mut);font-size:14px}
.sc svg{width:100%;height:70px;display:block;margin-top:8px;border-bottom:1px solid var(--bd)}
.set{max-width:450px;margin:0 auto}
.set h2{font-size:30px;margin:24px 0 20px}.set label{display:block;color:var(--mut);margin-bottom:6px}
.set textarea,.set select,.set input{width:100%;padding:11px 12px;background:var(--card);border:1px solid var(--bd);border-radius:4px}
.set p{color:var(--mut);font-size:14px}
.set textarea{resize:vertical;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--cell);border-radius:12px;padding:2px 10px;font-size:13px}.chip.off{color:var(--mut)}
.ent{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:12px;cursor:pointer}
.ent.cur{border-color:var(--g)}.ent b{display:block}.ent b::first-letter{text-transform:uppercase}
.ent p{color:var(--fg);font-size:16px;white-space:pre-wrap;margin:6px 0 0;overflow-wrap:anywhere}
dialog{border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);padding:24px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog input[type=text]{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;margin:6px 0 16px}
dialog input[type=color]{width:48px;height:36px;border:0;background:none;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
footer{text-align:center;color:var(--mut);padding:30px 0 50px}
#ss{font-size:13px;margin-top:6px;min-height:18px}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-position:center}
#bg.grid,.pv.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
#bg.dots,.pv.dots{background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:22px 22px}
#bg.aurora,.pv.aurora{background-image:radial-gradient(60% 50% at 20% 15%,#19c39a,transparent 70%),radial-gradient(50% 50% at 85% 20%,#6d5dfc,transparent 70%),radial-gradient(60% 60% at 60% 95%,#2dd4ff,transparent 70%)}
#bg.sunset,.pv.sunset{background-image:linear-gradient(160deg,#ff9966,#ff5e62 45%,#6a3093)}
#bg.ocean,.pv.ocean{background-image:linear-gradient(160deg,#2193b0,#1d4e89 55%,#0b1d3a)}
#bg.forest,.pv.forest{background-image:linear-gradient(160deg,#a8e063,#2f9e6e 50%,#0b3d2e)}
#bg.img{background-size:cover;background-repeat:no-repeat}
.pv{display:block;height:54px;border-radius:6px;border:1px solid var(--bd);margin-bottom:6px;background-color:var(--bg)}
.pv.grid{background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:14px 14px}
.pv.dots{background-image:radial-gradient(var(--mut) 1px,transparent 1px);background-size:12px 12px}
body.hb nav,body.hb footer{background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(8px)}
body.hb .set{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);border-radius:10px;padding:4px 24px 20px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:16px}
.bgb{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px;cursor:pointer;text-align:center;font-size:13px}
.bgb.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
.set input[type=range]{padding:0;border:0;background:none;accent-color:var(--g)}
.ban .x{position:absolute;top:8px;right:8px;background:none;border:0;cursor:pointer;color:var(--mut);font-size:16px;padding:4px 8px}.ban .x:hover{color:var(--fg)}
.ban ul{margin:8px 0 0;padding-left:20px}.ban li{margin:4px 0}.ban kbd{background:var(--cell);padding:1px 5px;border-radius:4px;font-size:12px}
.bgb{width:100%}
.bgw{position:relative}
.bgx{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:11px;line-height:22px;padding:0}
.sg .ch{margin-bottom:6px}.sg .ch h2{font-size:20px}
.si{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bd)}
.si .ic{flex-shrink:0}
.hn{font-size:14px;margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.hn b{color:var(--mut)}
.c.n{position:relative}.c.n::after{content:'';position:absolute;left:4px;top:4px;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.9)}
#jd{width:min(440px,94vw);padding:0}
.jh{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--bd)}.jh b{flex:1;font-size:18px;overflow-wrap:anywhere}
.jdot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
.jh kbd{font-size:11px;background:var(--cell);color:var(--mut);padding:2px 6px;border-radius:4px}
.jr{display:flex;gap:10px;padding:14px 22px;border-bottom:1px solid var(--bd);color:var(--mut)}.jr b{color:var(--fg)}
#jd label{display:block;padding:14px 22px 6px;color:var(--mut)}
#jd textarea{display:block;width:calc(100% - 44px);margin:0 22px;padding:11px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:6px;resize:vertical}
.jf{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 22px;border-top:1px solid var(--bd);margin-top:16px}
.jstreak{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:14px}.jstreak svg{width:14px;height:14px;fill:#f59e0b}.jstreak b{color:var(--fg)}
.jf .btn+.btn{margin-left:8px}
.pri{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
.dtw{display:flex;gap:8px;position:relative}.dtw input[type=text]{flex:1}
.dtn{position:absolute;right:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.set .av{width:72px;height:72px;font-size:30px;margin-top:6px}
.set .chk{display:flex;align-items:center;gap:10px;color:var(--fg);margin-top:14px}.set .chk input{width:auto;padding:0}
@media(max-width:600px){.card{padding:18px}nav{gap:18px}.ch h2{font-size:20px}}
</style>
</head>

// Mapa de calor: lunes arriba. YR=null -> últimos 12 meses; YR=año -> ese año.
function heat(fn,edit,hid,color){
 const t=today(),tk=key(t),ty=t.getFullYear();
 let from,to;
 if(YR){from=new Date(YR,0,1);to=YR<ty?new Date(YR,11,31):t}
 else{to=t;from=new Date(t);from.setDate(t.getDate()-364)}
 const start=new Date(from);start.setDate(from.getDate()-((from.getDay()+6)%7));
 const nw=Math.floor(Math.round((to-start)/864e5)/7)+1,lo=YR?from:start;
 let cells='',lab='',pm=YR?-1:start.getMonth();
 for(let w=0;w<nw;w++){
  const m=new Date(start);m.setDate(start.getDate()+w*7);
  const fv=m<lo?lo:m;
  if(fv.getMonth()!==pm){pm=fv.getMonth();lab+=`<span style="grid-column:${w+1}">${MES[pm]}</span>`}
  for(let d=0;d<7;d++){
   const x=new Date(start);x.setDate(start.getDate()+w*7+d);
   if(x>to||x<lo){cells+='<i class="c f"></i>';continue}
   const k=key(x);
   cells+=`<i class="c ${fn(k)}${k===tk?' t':''}" title="${fmt(k)}"${edit?` data-d="${k}" data-h="${hid}"`:''}></i>`;
  }
 }
 return`<div class="hw"><div class="hi"${color?` style="--c:${color}"`:''}><div class="ml">${lab}</div><div class="bd"><div class="dl">${DIAS.map(d=>`<span>${d}</span>`).join('')}</div><div class="cells">${cells}</div></div></div></div>`;
}

const dayn=k=>{const[y,m,d]=k.split('-');return Date.UTC(y,m-1,d)/864e5};
function stats(h){
 const ks=Object.keys(h.dates).sort(),t=today(),tk=key(t);
 let best=0,run=0,prev=null;
 ks.forEach(k=>{const n=dayn(k);run=(prev!==null&&n-prev===1)?run+1:1;prev=n;if(run>best)best=run});
 const d=new Date(t);if(!h.dates[key(d)])d.setDate(d.getDate()-1);
 let cur=0;while(h.dates[key(d)]){cur++;d.setDate(d.getDate()-1)}
 const mp=tk.slice(0,7),mo=ks.filter(k=>k.startsWith(mp)).length;
 return`<b>${cur}</b> ${cur===1?'día':'días'} de racha · mejor <b>${best}</b> · este mes <b>${mo}</b>/${t.getDate()} · total <b>${ks.length}</b>`;
}

const START=[['hidratacion','Beber 2 litros de agua'],['ejercicio','Hacer ejercicio 30 minutos'],['lectura','Leer 20 minutos'],['meditacion','Meditar 10 minutos'],['sueno','Dormir 7 a 8 horas'],['escritura','Escribir en un diario']];
const COL=['#19c39a','#6d5dfc','#f59e0b','#ef4444','#3b82f6','#ec4899','#14b8a6','#84cc16','#f97316','#a855f7'];
// Devuelve ideas de hábitos nuevos a partir de los que ya tienes (names) sin repetir los que descartaste (skip)
function sugerencias(names,skip=[]){
 const have=new Set(names.map(nz)),hit={},by={},out=[];
 names.forEach(n=>{const z=nz(n);for(const c in CAT)if(CAT[c].k.test(z)){hit[c]=(hit[c]||0)+1;(by[c]=by[c]||[]).push(n)}});
 const sc={},why={};
 for(const c in hit)for(const r in CAT[c].r){if(hit[r])continue;sc[r]=(sc[r]||0)+CAT[c].r[r];(why[r]=why[r]||[]).push(by[c][0])}
 Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).forEach(r=>{
  CAT[r].h.filter(n=>!have.has(nz(n))&&!skip.includes(nz(n))).slice(0,2).forEach(n=>out.push({n,cat:r,why:'Porque tienes “'+[...new Set(why[r])].slice(0,2).join('” y “')+'”'}));
 });
 if(!out.length)START.forEach(([c,n])=>{if(!hit[c]&&!have.has(nz(n))&&!skip.includes(nz(n)))out.push({n,cat:c,why:'Un buen punto de partida'})});
 return out;
}

 else if(a==='up'||a==='dn'){const i=S.habits.indexOf(h),j=a==='up'?i-1:i+1;if(S.habits[j]){[S.habits[i],S.habits[j]]=[S.habits[j],S.habits[i]];S.om=Date.now();save();list()}}
});

// ================= Respaldo JSON y sincronización con Google Drive =================
// PEGA AQUÍ tu ID de cliente de Google (termina en .apps.googleusercontent.com)
const CLIENT_ID='36276957250-2ch5vncvca8for09k1cijntthai2jb7g.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/drive.appdata',FN='habitos.json',GAPI='https://www.googleapis.com/';
let TOK=null,TEXP=0,TC=null,pend=null,busy=false,again=false,timer=null,LAST='',lastSync=0;
function conn(){return localStorage.getItem('habitos_drive')==='1'}
function dst(){return!CLIENT_ID?'Falta pegar el ID de cliente de Google en el archivo index.html.':(conn()?'Conectado.':'No conectado.')+(LAST?' '+LAST:'')}
function setSS(t,err){LAST=t;const e=$('#ss');if(e){e.textContent=(conn()||err)?t:'';e.style.color=err?'var(--red)':''}const d=$('#dst');if(d)d.textContent=dst()}

// <merge>
const mx=(a,b)=>Math.max(+a||0,+b||0);
const valid=o=>!!o&&typeof o==='object'&&Array.isArray(o.habits);
// Combina dos copias sin perder nada: lo más reciente gana en cada día de cada hábito y en cada entrada del diario.
function merge(A,B){
 const nw=(A.mt||0)>=(B.mt||0)?A:B,no=(A.om||0)>=(B.om||0)?A:B,ot=no===A?B:A;
 const del={...B.del,...A.del},g=(X,id)=>X.habits.find(h=>h.id===id);
 const ids=[...no.habits,...ot.habits.filter(h=>!g(no,h.id))].map(h=>h.id).filter(id=>!del[id]);
 const habits=ids.map(id=>{
  const a=g(A,id),b=g(B,id);
  if(!a||!b)return JSON.parse(JSON.stringify(a||b));
  const bs=(a.u||0)>=(b.u||0)?a:b,dates={},dx={};
  new Set([...Object.keys(a.dates),...Object.keys(b.dates),...Object.keys(a.dx),...Object.keys(b.dx)]).forEach(k=>{
   const on=mx(a.dates[k],b.dates[k]),off=mx(a.dx[k],b.dx[k]);
   if(on>off)dates[k]=on;else if(off)dx[k]=off;
  });
  const jn={},jm={};
  new Set([...Object.keys(a.jn),...Object.keys(b.jn),...Object.keys(a.jm),...Object.keys(b.jm)]).forEach(k=>{
   const ta=a.jm[k]||0,tb=b.jm[k]||0,w=ta>=tb?a:b,o=w===a?b:a,t=Math.max(ta,tb),x=w.jn[k]||(t?'':(o.jn[k]||''));
   if(t)jm[k]=t;if(x)jn[k]=x;
  });
  return{id,name:bs.name,color:bs.color,u:mx(a.u,b.u),created:a.created<b.created?a.created:b.created,dates,dx,jn,jm};
 });
 const diary={},dm={};
 new Set([...Object.keys(A.diary),...Object.keys(B.diary),...Object.keys(A.dm),...Object.keys(B.dm)]).forEach(k=>{
  const ta=A.dm[k]||0,tb=B.dm[k]||0,w=ta>=tb?A:B,o=w===A?B:A,t=Math.max(ta,tb),x=w.diary[k]||(t?'':(o.diary[k]||''));
  if(t)dm[k]=t;if(x)diary[k]=x;
 });
 const wpdel={...B.wpdel,...A.wpdel},wp={};
 [B.wp,A.wp].forEach(m=>Object.keys(m).forEach(id=>{if(!wpdel[id])wp[id]=m[id]}));
 const bg=(A.bg.t||0)>=(B.bg.t||0)?A.bg:B.bg,av=(A.av.t||0)>=(B.av.t||0)?A.av:B.av;
 return{habits,diary,dm,del,wp,wpdel,bg,av,user:nw.user,theme:A.theme,mt:mx(A.mt,B.mt),om:mx(A.om,B.om)};
}
// </merge>

function exportar(){
 const b=new Blob([JSON.stringify((({wp,wpdel,bg,...D})=>D)(S),null,1)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='habitos-respaldo-'+key(today())+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importar(inp){
 const f=inp.files[0];if(!f)return;
 f.text().then(t=>{
  let j;try{j=JSON.parse(t)}catch(e){return alert('El archivo no es un JSON válido.')}
  if(!valid(j))return alert('El archivo no parece un respaldo de esta app.');
  if(!confirm('Se combinará con tus datos actuales; no se borra nada. ¿Continuar?'))return;
  S=merge(S,norm(j));save();view();
 });
 inp.value='';
}

function tc(){return TC||(TC=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
 callback:r=>{const p=pend;pend=null;if(!p)return;if(r.error)p.rej(r);else{TOK=r.access_token;TEXP=Date.now()+(r.expires_in||3600)*1000;p.res(TOK)}},
 error_callback:e=>{const p=pend;pend=null;if(p)p.rej(e)}}))}
function token(inter){
 return new Promise((res,rej)=>{
  if(TOK&&Date.now()<TEXP-60000)return res(TOK);
  if(!window.google||!google.accounts)return rej({error:'offline'});
  const p={res,rej};pend=p;
  setTimeout(()=>{if(pend===p){pend=null;rej({error:'timeout'})}},inter?180000:10000);
  tc().requestAccessToken({prompt:inter?'':'none'});
 });
}
async function gf(url,o={}){
 const r=await fetch(url,{...o,headers:{Authorization:'Bearer '+TOK,...(o.headers||{})}});
 if(r.status===401){TOK=null;throw{error:'auth'}}
 if(!r.ok)throw{error:'http',status:r.status};
 return r;
}
function errMsg(e){
 if(e instanceof TypeError)return'Sin conexión a internet.';
 const c=e&&(e.error||e.type);
 if(c==='offline')return'No se pudo cargar Google. Revisa tu conexión.';
 if(c==='access_denied')return'Permiso denegado en Google.';
 if(c==='http')return e.status===403?'Drive rechazó la petición: revisa que la API de Google Drive esté habilitada.':'Error de Drive ('+e.status+').';
 return conn()?'Sesión de Google caducada: ve a Ajustes y pulsa “Sincronizar ahora”.':'No se completó la conexión con Google.';
}
// inter=true solo desde un clic (abre la ventana de Google); false = intento silencioso
async function sync(inter){
 if(!CLIENT_ID){setSS('Falta el ID de cliente de Google.',true);return}
 if(busy){again=true;return}
 busy=true;setSS('Sincronizando…');
 try{
  await token(inter);
  const l=await(await gf(GAPI+'drive/v3/files?spaces=appDataFolder&orderBy=createdTime&pageSize=200&fields=files(id,name)&q='+encodeURIComponent('trashed=false'))).json();
  const files=l.files||[],df=files.find(f=>f.name===FN),id=df&&df.id,wf={};
  files.forEach(f=>{const m=/^wp-(.+)\.jpg$/.exec(f.name);if(m)wf[m[1]]=f.id});
  let R=null;
  if(id){const j=await(await gf(GAPI+'drive/v3/files/'+id+'?alt=media')).json();if(valid(j))R=norm(j)}
  const snap=JSON.stringify(S),M=R?merge(S,R):S,out=JSON.stringify(M);
  // 1) los fondos nuevos se suben antes que el archivo de datos que los menciona
  for(const w of Object.keys(M.wp)){if(!wf[w]){const bl=await wpGet(w);if(bl)wf[w]=await wpUpload(w,bl)}}
  // 2) datos
  if(!R||out!==JSON.stringify(R)){
   if(id)await gf(GAPI+'upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:out});
   else{
    const bd='hab'+Date.now();
    await gf(GAPI+'upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},
     body:'--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:FN,parents:['appDataFolder']})+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+out+'\r\n--'+bd+'--'});
   }
  }
  let changed=false;
  if(JSON.stringify(S)!==snap)again=true;
  else if(out!==snap){S=M;persist();changed=true}
  // 3) bajar los fondos que faltan en este dispositivo
  for(const w of Object.keys(M.wp)){if(wf[w]&&!(await wpGet(w))){const r=await gf(GAPI+'drive/v3/files/'+wf[w]+'?alt=media');await wpPut(w,await r.blob()).catch(()=>{});changed=true}}
  // 4) limpiar: borrar de Drive los fondos eliminados y de este dispositivo los que ya no existen
  for(const w of Object.keys(wf)){if(M.wpdel[w])await gf(GAPI+'drive/v3/files/'+wf[w],{method:'DELETE'}).catch(()=>{})}
  for(const k of await wpKeys()){if(!M.wp[k]&&!S.wp[k])await wpDel(k)}
  if(changed){applyBg();if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName))view()}
  localStorage.setItem('habitos_drive','1');lastSync=Date.now();
  setSS('Sincronizado ✓ '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setSS(errMsg(e),true)}
 finally{busy=false;if(again){again=false;sync(false)}}
}
function push(){if(!conn()||!CLIENT_ID)return;clearTimeout(timer);timer=setTimeout(()=>sync(false),2500)}
function desconectar(){
 localStorage.removeItem('habitos_drive');
 if(TOK&&window.google)try{google.accounts.oauth2.revoke(TOK)}catch(e){}
 TOK=null;setSS('');view();
}
window.gsiReady=()=>{if(conn())sync(false)};
if(window.google&&google.accounts)gsiReady();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&conn()&&Date.now()-lastSync>20000)sync(false)});

addEventListener('hashchange',view);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
view();
</script>
