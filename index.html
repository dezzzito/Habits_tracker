<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis hábitos</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12151c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer onload="window.gsiReady&&gsiReady()"></script>
<style>
:root{--bg:#fff;--fg:#2d3748;--mut:#8792a8;--bd:#e2e6ee;--card:#fff;--cell:#eef0f6;--g:#19c39a;--grid:rgba(0,0,0,.035);--warn:#fffbe6;--warnb:#f0e2a0;--red:#f0616d;color-scheme:light;--dot:rgba(0,0,0,.08)}
[data-theme=dark]{--bg:#12151c;--fg:#e6e9f0;--mut:#7e889c;--bd:#2a3040;--card:#171b24;--cell:#222836;--grid:rgba(255,255,255,.03);--warn:#2a2614;--warnb:#4d4420;color-scheme:dark;--dot:rgba(255,255,255,.07)}
*{box-sizing:border-box}
body{margin:0;font:500 16px/1.4 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg);background-color:var(--bg)}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 28px;padding:24px 12px}
nav a{display:flex;align-items:center;gap:8px;color:var(--mut);text-decoration:none;font-weight:600}
nav a.on{color:var(--fg)}nav a.on svg{color:var(--g)}
nav svg{width:16px;height:16px;fill:currentColor}
main{max-width:1002px;margin:0 auto;padding:0 16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:10px 12px;cursor:pointer}
.btn:hover{border-color:var(--mut)}
.tb{display:flex;gap:16px;margin:16px 0 40px;flex-wrap:wrap}
.sb{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:0 12px}
.sb input{flex:1;border:0;background:none;outline:0;padding:11px 0;min-width:0}
.sb span{color:var(--mut)}.sb kbd{font-size:11px;background:var(--cell);color:var(--mut);padding:2px 6px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:32px;margin-bottom:38px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.ch h2{margin:0;font-size:24px;font-weight:700;overflow-wrap:anywhere}
.ic{display:flex;align-items:center;gap:4px}
.ib{background:none;border:0;color:var(--mut);cursor:pointer;padding:4px 8px;font-size:16px}
.dd{position:relative}.dd summary{list-style:none;cursor:pointer;padding:4px 8px;color:var(--mut)}
.dd summary::-webkit-details-marker{display:none}
.dd div{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--bd);border-radius:6px;z-index:5;display:flex;flex-direction:column;min-width:130px;overflow:hidden}
.dd button{background:none;border:0;padding:10px 14px;text-align:left;cursor:pointer}.dd button:hover{background:var(--cell)}
.hw{overflow-x:auto;padding-bottom:6px}
.hi{display:inline-block;min-width:100%;padding:3px 4px 3px 0}
.ml{display:grid;grid-auto-flow:column;grid-auto-columns:12px;gap:5px;height:20px;margin-left:44px;font-size:12px;color:var(--fg)}
.ml span{white-space:nowrap}
.bd{display:flex}
.dl{display:grid;grid-template-rows:repeat(7,12px);gap:5px;width:44px;font-size:12px;line-height:12px}
.cells{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:5px}
.c{display:block;width:12px;height:12px;border-radius:2px;background:var(--cell)}
[data-d]{cursor:pointer}
.c.on{background:var(--c,var(--g))}
.c.l1{background:color-mix(in srgb,var(--g) 30%,var(--cell))}
.c.l2{background:color-mix(in srgb,var(--g) 55%,var(--cell))}
.c.l3{background:color-mix(in srgb,var(--g) 78%,var(--cell))}
.c.l4{background:var(--g)}
.c.f{visibility:hidden}
.c.t{outline:1.5px solid var(--fg)}
.lt{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.st{font-size:14px;color:var(--mut)}.st b{color:var(--fg)}
.lt .btn{font-weight:600;padding:12px 14px;margin-left:auto}.lt .btn.ok{color:var(--g);border-color:var(--g)}
.empty{text-align:center;color:var(--mut);padding:50px 0}
.ban{position:relative;background:var(--warn);border:1px solid var(--warnb);border-radius:4px;padding:16px 44px 16px 16px;margin:16px 0 24px}
.ph{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.av{width:96px;height:96px;border-radius:50%;background:#ffd84d;border:2px solid #111;display:grid;place-items:center;font-size:42px;font-weight:700;color:#111}
.pi{flex:1;min-width:180px;display:flex;flex-direction:column;justify-content:center}
.pi h1{margin:0 0 6px;font-size:30px}
.sc{flex:1;min-width:260px;max-width:384px;background:var(--card);border:1px solid var(--bd);border-radius:4px;padding:12px;color:var(--mut);font-size:14px}
.sc svg{width:100%;height:70px;display:block;margin-top:8px;border-bottom:1px solid var(--bd)}
.set{max-width:450px;margin:0 auto}
.set h2{font-size:30px;margin:24px 0 20px}.set label{display:block;color:var(--mut);margin-bottom:6px}
.set textarea,.set select,.set input{width:100%;padding:11px 12px;background:var(--card);border:1px solid var(--bd);border-radius:4px}
.set p{color:var(--mut);font-size:14px}
.set textarea{resize:vertical;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--cell);border-radius:12px;padding:2px 10px;font-size:13px}.chip.off{color:var(--mut)}
.ent{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:12px;cursor:pointer}
.ent.cur{border-color:var(--g)}.ent b{display:block}.ent b::first-letter{text-transform:uppercase}
.ent p{color:var(--fg);font-size:16px;white-space:pre-wrap;margin:6px 0 0;overflow-wrap:anywhere}
dialog{border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);padding:24px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog input[type=text]{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;margin:6px 0 16px}
dialog input[type=color]{width:48px;height:36px;border:0;background:none;padding:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
footer{text-align:center;color:var(--mut);padding:30px 0 50px}
#ss{font-size:13px;margin-top:6px;min-height:18px}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background-position:center}
#bg.grid,.pv.grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
#bg.dots,.pv.dots{background-image:radial-gradient(var(--dot) 1.5px,transparent 1.5px);background-size:22px 22px}
#bg.aurora,.pv.aurora{background-image:radial-gradient(60% 50% at 20% 15%,#19c39a,transparent 70%),radial-gradient(50% 50% at 85% 20%,#6d5dfc,transparent 70%),radial-gradient(60% 60% at 60% 95%,#2dd4ff,transparent 70%)}
#bg.sunset,.pv.sunset{background-image:linear-gradient(160deg,#ff9966,#ff5e62 45%,#6a3093)}
#bg.ocean,.pv.ocean{background-image:linear-gradient(160deg,#2193b0,#1d4e89 55%,#0b1d3a)}
#bg.forest,.pv.forest{background-image:linear-gradient(160deg,#a8e063,#2f9e6e 50%,#0b3d2e)}
#bg.img{background-size:cover;background-repeat:no-repeat}
.pv{display:block;height:54px;border-radius:6px;border:1px solid var(--bd);margin-bottom:6px;background-color:var(--bg)}
.pv.grid{background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:14px 14px}
.pv.dots{background-image:radial-gradient(var(--mut) 1px,transparent 1px);background-size:12px 12px}
body.hb nav,body.hb footer{background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(8px)}
body.hb .set{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);border-radius:10px;padding:4px 24px 20px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:16px}
.bgb{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px;cursor:pointer;text-align:center;font-size:13px}
.bgb.sel{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
.set input[type=range]{padding:0;border:0;background:none;accent-color:var(--g)}
.ban .x{position:absolute;top:8px;right:8px;background:none;border:0;cursor:pointer;color:var(--mut);font-size:16px;padding:4px 8px}.ban .x:hover{color:var(--fg)}
.ban ul{margin:8px 0 0;padding-left:20px}.ban li{margin:4px 0}.ban kbd{background:var(--cell);padding:1px 5px;border-radius:4px;font-size:12px}
@media(max-width:600px){.card{padding:18px}nav{gap:18px}.ch h2{font-size:20px}}
</style>
</head>
<body>
<div id="bg"></div>
<nav>
 <a href="#habitos" data-v="habitos"><svg viewBox="0 0 16 16"><path d="M3 1h10a2 2 0 012 2v10a2 2 0 01-2 2H3a2 2 0 01-2-2V3a2 2 0 012-2zm7.3 4.3L7 8.6 5.7 7.3 4.6 8.4 7 10.8l4.4-4.4z"/></svg>Mis hábitos</a>
 <a href="#diario" data-v="diario"><svg viewBox="0 0 16 16"><path d="M1 2h5a2 2 0 012 2v10a2 2 0 00-2-2H1zM15 2h-5a2 2 0 00-2 2v10a2 2 0 012-2h5z"/></svg>Diario</a>
 <a href="#perfil" data-v="perfil"><svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3.2"/><path d="M2 15c0-3.3 2.7-5 6-5s6 1.7 6 5z"/></svg>Perfil</a>
 <a href="#ajustes" data-v="ajustes"><svg viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 5.5a2.5 2.5 0 100 5 2.5 2.5 0 000-5zM7 0h2l.4 1.9 1.5.6 1.6-1.1 1.4 1.4-1.1 1.6.6 1.5L16 7v2l-1.9.4-.6 1.5 1.1 1.6-1.4 1.4-1.6-1.1-1.5.6L9 16H7l-.4-1.9-1.5-.6-1.6 1.1-1.4-1.4 1.1-1.6-.6-1.5L0 9V7l1.9-.4.6-1.5-1.1-1.6L2.8 2.1l1.6 1.1 1.5-.6z"/></svg>Ajustes</a>
</nav>
<main id="app"></main>
<footer>Hecho con <span style="color:#f472b6">♥</span><div id="ss"></div></footer>
<input type="color" id="cc" tabindex="-1" aria-hidden="true" style="position:fixed;left:-100px;top:0;width:1px;height:1px;opacity:0;pointer-events:none">
<dialog id="dlg">
 <form method="dialog" id="frm">
  <label for="nm">Nombre del hábito</label>
  <input type="text" id="nm" maxlength="60" placeholder="Ej. Leer 20 minutos" required>
  <div class="row"><label for="col">Color</label><input type="color" id="col" value="#19c39a"></div>
  <div class="row" style="margin-top:20px"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn" style="background:var(--g);color:#fff;border-color:var(--g)">Crear hábito</button></div>
 </form>
</dialog>
<script>
const K='habitos_v1',$=s=>document.querySelector(s);
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const DIAS=['Lun','','Mié','','Vie','',''];
let Q='',REORD=false,YR=null;
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.habits)return d}catch(e){}
 return{habits:[],user:'Usuario',theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}})();
const norm=o=>{o.habits=o.habits||[];o.habits.forEach(h=>{h.dates=h.dates||{};h.dx=h.dx||{};h.u=h.u||0});o.diary=o.diary||{};o.dm=o.dm||{};o.del=o.del||{};o.mt=o.mt||0;o.om=o.om||0;return o};
norm(S);
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const save=()=>{S.mt=Date.now();persist();push()};
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};

// <heat>
// Mapa de calor: lunes arriba. YR=null -> últimos 12 meses; YR=año -> ese año.
function heat(fn,edit,hid,color){
 const t=today(),tk=key(t),ty=t.getFullYear();
 let from,to;
 if(YR){from=new Date(YR,0,1);to=YR<ty?new Date(YR,11,31):t}
 else{to=t;from=new Date(t);from.setDate(t.getDate()-364)}
 const start=new Date(from);start.setDate(from.getDate()-((from.getDay()+6)%7));
 const nw=Math.floor(Math.round((to-start)/864e5)/7)+1,lo=YR?from:start;
 let cells='',lab='',pm=YR?-1:start.getMonth();
 for(let w=0;w<nw;w++){
  const m=new Date(start);m.setDate(start.getDate()+w*7);
  const fv=m<lo?lo:m;
  if(fv.getMonth()!==pm){pm=fv.getMonth();lab+=`<span style="grid-column:${w+1}">${MES[pm]}</span>`}
  for(let d=0;d<7;d++){
   const x=new Date(start);x.setDate(start.getDate()+w*7+d);
   if(x>to||x<lo){cells+='<i class="c f"></i>';continue}
   const k=key(x);
   cells+=`<i class="c ${fn(k)}${k===tk?' t':''}" title="${k}"${edit?` data-d="${k}" data-h="${hid}"`:''}></i>`;
  }
 }
 return`<div class="hw"><div class="hi"${color?` style="--c:${color}"`:''}><div class="ml">${lab}</div><div class="bd"><div class="dl">${DIAS.map(d=>`<span>${d}</span>`).join('')}</div><div class="cells">${cells}</div></div></div></div>`;
}
// </heat>
// <stats>
const dayn=k=>{const[y,m,d]=k.split('-');return Date.UTC(y,m-1,d)/864e5};
function stats(h){
 const ks=Object.keys(h.dates).sort(),t=today(),tk=key(t);
 let best=0,run=0,prev=null;
 ks.forEach(k=>{const n=dayn(k);run=(prev!==null&&n-prev===1)?run+1:1;prev=n;if(run>best)best=run});
 const d=new Date(t);if(!h.dates[key(d)])d.setDate(d.getDate()-1);
 let cur=0;while(h.dates[key(d)]){cur++;d.setDate(d.getDate()-1)}
 const mp=tk.slice(0,7),mo=ks.filter(k=>k.startsWith(mp)).length;
 return`<b>${cur}</b> ${cur===1?'día':'días'} de racha · mejor <b>${best}</b> · este mes <b>${mo}</b>/${t.getDate()} · total <b>${ks.length}</b>`;
}
// </stats>
function yrsel(){
 const ty=new Date().getFullYear(),my=Math.min(ty,...S.habits.map(h=>+h.created.slice(0,4)).filter(Boolean));
 let o='<option value="">Últimos 12 meses</option>';
 for(let y=ty;y>=my;y--)o+=`<option value="${y}"${YR===y?' selected':''}>${y}</option>`;
 return`<select class="btn" id="yr" aria-label="Año">${o}</select>`;
}
function applyTheme(){
 document.documentElement.dataset.theme=S.theme;
 const m=$('meta[name=theme-color]');if(m)m.content=S.theme==='dark'?'#12151c':'#ffffff';
}

// Cumplimiento del día = hábitos hechos / hábitos que ya existían ese día
function pct(k){let a=0,d=0;for(const h of S.habits)if(h.created<=k){a++;if(h.dates[k])d++}return a?d/a:0}
const lvl=p=>p===0?'':p<=.25?'l1':p<=.5?'l2':p<=.75?'l3':'l4';

function card(h,edit){
 const done=!!h.dates[key(today())];
 const ctl=edit?`<div class="ic">${REORD?'<button class="ib" data-a="up">↑</button><button class="ib" data-a="dn">↓</button>':''}<details class="dd"><summary>⋮</summary><div><button data-a="ren">Renombrar</button><button data-a="col">Cambiar color</button><button data-a="del">Eliminar</button></div></details></div>`:'';
 return`<section class="card" data-id="${h.id}"><div class="ch"><h2>${esc(h.name)}</h2>${ctl}</div>${heat(k=>h.dates[k]?'on':'',edit,h.id,h.color)}${edit?`<div class="lt"><div class="st">${stats(h)}</div><button class="btn${done?' ok':''}" data-a="today">${done?'✓ Hecho hoy':'Registrar hoy →'}</button></div>`:''}</section>`;
}
function list(){
 const q=Q.toLowerCase(),hs=S.habits.filter(h=>h.name.toLowerCase().includes(q));
 $('#list').innerHTML=hs.length?hs.map(h=>card(h,true)).join(''):`<div class="empty">${S.habits.length?'Ningún hábito coincide con la búsqueda.':'Aún no tienes hábitos. Crea el primero con “Crear hábito”.'}</div>`;
 scrollHM();
}
function scrollHM(){document.querySelectorAll('.hw').forEach(e=>e.scrollLeft=(YR&&YR<new Date().getFullYear())?0:e.scrollWidth)}

function perfil(){
 const t=today();let days=0,pts=0,pts2=[];
 for(let i=364;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);pts2.push(pct(key(d)))}
 const set=new Set();S.habits.forEach(h=>Object.keys(h.dates).forEach(k=>{set.add(k);pts++}));days=set.size;
 const poly=pts2.map((p,i)=>`${i},${58-p*54}`).join(' ');
 return`${tip('perfil')}
 <div class="ph"><div class="av">${esc((S.user||'U')[0].toUpperCase())}</div><div class="pi"><h1>${esc(S.user)}</h1><div>${days} ${days===1?'día registrado':'días registrados'}</div><div>${pts} ${pts===1?'punto':'puntos'}</div></div>
 <div class="sc">Puntaje diario (1 año):<svg viewBox="0 0 364 60" preserveAspectRatio="none"><polyline points="${poly}" fill="none" stroke="var(--g)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></div></div>
 <section class="card"><div class="ch"><h2>Cumplimiento diario</h2>${yrsel()}</div>${heat(k=>lvl(pct(k)),false)}</section>`+S.habits.map(h=>card(h,false)).join('');
}
function ajustes(){
 return`<div class="set">${tip('ajustes')}<h2>Apariencia</h2><label for="th">Modo claro / oscuro:</label>
 <select id="th"><option value="light">☀ Claro</option><option value="dark">☾ Oscuro</option></select>
 ${bgHtml()}
 <h2>Detalles del perfil</h2><label for="un">Nombre de usuario:</label><input id="un" maxlength="30" value="${esc(S.user)}">
 <h2>Respaldo</h2><p>Descarga una copia de tus datos o restáurala desde un archivo. Al importar, los datos se combinan con los actuales y no se borra nada.</p>
 <div class="row" style="justify-content:flex-start"><button class="btn" data-a="exp">Exportar JSON</button><button class="btn" data-a="imp">Importar JSON</button></div><input type="file" id="fi" accept=".json,application/json" hidden>
 <h2>Google Drive</h2><p id="dst"></p>
 <div class="row" style="justify-content:flex-start"><button class="btn" data-a="conn">${conn()?'Sincronizar ahora':'Conectar con Google Drive'}</button>${conn()?'<button class="btn" data-a="disc">Desconectar</button>':''}</div>
 <p>Si conectas Drive, tus datos también se guardan en una carpeta oculta de tu cuenta de Google que solo esta app puede leer.</p>
 <h2>Tutoriales</h2><p>Los avisos de ayuda de cada sección se cierran con la ✕.</p>
 <div class="row" style="justify-content:flex-start"><button class="btn" data-a="tips">Mostrar los tutoriales de nuevo</button></div></div>`;
}

// ===== Tutoriales: avisos de ayuda que se pueden cerrar con la ✕ =====
const TIPK='habitos_tips';
const tipsOff=()=>{try{return JSON.parse(localStorage.getItem(TIPK))||[]}catch(e){return[]}};
const TIPS={
 habitos:()=>`<b>Cómo usar “Mis hábitos”</b><ul>
  <li>Pulsa <b>Crear hábito</b> para añadir uno con su nombre y su color.</li>
  <li>Toca <b>Registrar hoy</b> o cualquier cuadrito del mapa para marcar ese día como cumplido. Tócalo de nuevo para desmarcarlo. También puedes marcar días pasados.</li>
  <li>En el menú <b>⋮</b> de cada hábito puedes renombrarlo, cambiarle el color o eliminarlo.</li>
  <li>Con el selector de años ves años anteriores, con <b>Reordenar</b> cambias el orden y con la búsqueda (<kbd>Ctrl</kbd> + <kbd>K</kbd>) filtras tus hábitos.</li></ul>`,
 diario:()=>`<b>Cómo usar el “Diario”</b><ul>
  <li>Escribe una entrada por día; se guarda sola mientras escribes.</li>
  <li>Arriba ves qué hábitos cumpliste ese día. Cambia la fecha para escribir sobre otro día.</li>
  <li>Toca una entrada anterior para abrirla y editarla.</li></ul>`,
 perfil:()=>`<b>Tu perfil</b><ul>
  <li>Aquí ves tus <b>días registrados</b>, tus <b>puntos</b> (uno por cada hábito cumplido) y el gráfico de puntaje diario.</li>
  <li>En “Cumplimiento diario”, cuanto más intenso es el verde, mayor es el porcentaje de hábitos que cumpliste ese día.</li>
  <li>${conn()?'Tus datos se guardan en este dispositivo y se sincronizan con tu cuenta de Google.':'Tus datos se guardan solo en este dispositivo. Conecta Google Drive en Ajustes para sincronizarlos con tus otros dispositivos.'}</li></ul>`,
 ajustes:()=>`<b>Cómo usar los “Ajustes”</b><ul>
  <li>Elige modo claro u oscuro y cambia el fondo de la web.</li>
  <li><b>Exportar JSON</b> descarga una copia de tus datos y <b>Importar JSON</b> la restaura sin borrar nada.</li>
  <li>Conecta <b>Google Drive</b> para sincronizar tus datos entre dispositivos. Si ves un aviso rojo debajo del pie de página, pulsa “Sincronizar ahora”.</li>
  <li>En el móvil puedes instalar la web desde el menú del navegador con “Añadir a pantalla de inicio”.</li></ul>`
};
const tip=id=>tipsOff().includes(id)?'':`<div class="ban"><button class="x" data-a="tipx" data-t="${id}" aria-label="Cerrar">✕</button>${TIPS[id]()}</div>`;

// ===== Fondo de la web (solo en este dispositivo) =====
const BGK='habitos_bg',BGI='habitos_bgimg';
const PRE={grid:{n:'Cuadrícula',o:1},dots:{n:'Puntos',o:1},aurora:{n:'Aurora',o:.5},sunset:{n:'Atardecer',o:.5},ocean:{n:'Océano',o:.5},forest:{n:'Bosque',o:.5},solid:{n:'Liso',o:1}};
const bgImg=()=>{try{return localStorage.getItem(BGI)||''}catch(e){return''}};
let BG=(()=>{try{const b=JSON.parse(localStorage.getItem(BGK));if(b&&(PRE[b.k]||b.k==='img'))return{k:b.k,o:isFinite(+b.o)?Math.min(1,Math.max(0,+b.o)):1}}catch(e){}return{k:'grid',o:1}})();
const saveBg=()=>{try{localStorage.setItem(BGK,JSON.stringify(BG))}catch(e){}};
function applyBg(){
 const b=$('#bg'),img=BG.k==='img'?bgImg():'';
 if(BG.k==='img'&&!img)BG={k:'grid',o:1};
 b.className=BG.k;b.style.backgroundImage=img?`url("${img}")`:'';b.style.opacity=BG.o;
 document.body.classList.toggle('hb',!['grid','dots','solid'].includes(BG.k));
}
function setBg(k){BG={k,o:k==='img'?.4:PRE[k].o};saveBg();applyBg();view()}
function quitarFondo(){try{localStorage.removeItem(BGI)}catch(e){}if(BG.k==='img')BG={k:'grid',o:1};saveBg();applyBg();view()}
// Reduce la imagen antes de guardarla para que quepa en el almacenamiento del navegador
function subirFondo(inp){
 const f=inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  const im=new Image();
  im.onload=()=>{
   let ok=false;
   for(const m of [1920,1400,1000]){
    const sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    try{localStorage.setItem(BGI,c.toDataURL('image/jpeg',.8));ok=true;break}catch(e){}
   }
   if(!ok)return alert('La imagen es demasiado grande para guardarla en este dispositivo. Prueba con una más pequeña.');
   BG={k:'img',o:.4};saveBg();applyBg();view();
  };
  im.onerror=()=>alert('No se pudo leer esa imagen.');
  im.src=r.result;
 };
 r.readAsDataURL(f);inp.value='';
}

  +(img?`<button class="bgb${BG.k==='img'?' sel':''}" data-a="bg" data-k="img"><span class="pv" style="background:url('${img}') center/cover"></span>Mi imagen</button>`:'');
 return`<h2>Fondo</h2><div class="bgs">${tiles}</div>
 <label for="bgo">Opacidad del fondo: <b id="bgov">${Math.round(BG.o*100)}%</b></label>
 <input type="range" id="bgo" min="0" max="100" value="${Math.round(BG.o*100)}">
 <div class="row" style="justify-content:flex-start;margin-top:14px"><button class="btn" data-a="bgup">Subir mi imagen</button>${img?'<button class="btn" data-a="bgrm">Quitar mi imagen</button>':''}</div><input type="file" id="bgf" accept="image/*" hidden>
 <p>Las imágenes que subas se guardan solo en este dispositivo y no se sincronizan.</p>`;
}
applyBg();

let DK=key(today());
const done=k=>S.habits.filter(h=>h.dates[k]).map(h=>h.name);
const fd=k=>new Date(k+'T00:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const chips=k=>{const d=done(k);return d.length?d.map(n=>`<span class="chip">✓ ${esc(n)}</span>`).join(''):'<span class="chip off">Sin hábitos registrados</span>'};
function diario(){

function ents(){

function view(){

 applyTheme();
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
 const a=$('#app');

 else if(v==='diario'){a.innerHTML=diario();ents()}

 else{a.innerHTML=`${tip('habitos')}<div class="tb"><label class="sb"><span>⌕</span><input id="q" placeholder="Buscar hábitos" value="${esc(Q)}"><kbd>Ctrl</kbd><kbd>K</kbd></label>${yrsel()}<button class="btn" data-a="reord">Reordenar ⇅</button><button class="btn" data-a="new">Crear hábito ▾</button></div><div id="list"></div>`;list()}
}
const find=id=>S.habits.find(h=>h.id===id);
function toggle(id,k){const h=find(id),t=Date.now();if(h.dates[k]){delete h.dates[k];h.dx[k]=t}else{h.dates[k]=t;delete h.dx[k];if(k<h.created)h.created=k}save();list()}

 else if(a==='ren'){const n=prompt('Nuevo nombre del hábito',h.name);if(n&&n.trim()){h.name=n.trim().slice(0,60);h.u=Date.now();save();list()}}
 else if(a==='del'){if(confirm(`¿Eliminar “${h.name}” y todo su historial?`)){S.del[h.id]=Date.now();S.habits=S.habits.filter(x=>x!==h);save();list()}}
 else if(a==='up'||a==='dn'){const i=S.habits.indexOf(h),j=a==='up'?i-1:i+1;if(S.habits[j]){[S.habits[i],S.habits[j]]=[S.habits[j],S.habits[i]];S.om=Date.now();save();list()}}
});
$('#app').addEventListener('input',e=>{
 if(e.target.id==='q'){Q=e.target.value;list()}

// ================= Respaldo JSON y sincronización con Google Drive =================
// PEGA AQUÍ tu ID de cliente de Google (termina en .apps.googleusercontent.com)
const CLIENT_ID='36276957250-2ch5vncvca8for09k1cijntthai2jb7g.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/drive.appdata',FN='habitos.json',GAPI='https://www.googleapis.com/';
let TOK=null,TEXP=0,TC=null,pend=null,busy=false,again=false,timer=null,LAST='',lastSync=0;
function conn(){return localStorage.getItem('habitos_drive')==='1'}
function dst(){return!CLIENT_ID?'Falta pegar el ID de cliente de Google en el archivo index.html.':(conn()?'Conectado.':'No conectado.')+(LAST?' '+LAST:'')}
function setSS(t,err){LAST=t;const e=$('#ss');if(e){e.textContent=(conn()||err)?t:'';e.style.color=err?'var(--red)':''}const d=$('#dst');if(d)d.textContent=dst()}

// <merge>
const mx=(a,b)=>Math.max(+a||0,+b||0);
const valid=o=>!!o&&typeof o==='object'&&Array.isArray(o.habits);
// Combina dos copias sin perder nada: lo más reciente gana en cada día de cada hábito y en cada entrada del diario.
function merge(A,B){
 const nw=(A.mt||0)>=(B.mt||0)?A:B,no=(A.om||0)>=(B.om||0)?A:B,ot=no===A?B:A;
 const del={...B.del,...A.del},g=(X,id)=>X.habits.find(h=>h.id===id);
 const ids=[...no.habits,...ot.habits.filter(h=>!g(no,h.id))].map(h=>h.id).filter(id=>!del[id]);
 const habits=ids.map(id=>{
  const a=g(A,id),b=g(B,id);
  if(!a||!b)return JSON.parse(JSON.stringify(a||b));
  const bs=(a.u||0)>=(b.u||0)?a:b,dates={},dx={};
  new Set([...Object.keys(a.dates),...Object.keys(b.dates),...Object.keys(a.dx),...Object.keys(b.dx)]).forEach(k=>{
   const on=mx(a.dates[k],b.dates[k]),off=mx(a.dx[k],b.dx[k]);
   if(on>off)dates[k]=on;else if(off)dx[k]=off;
  });
  return{id,name:bs.name,color:bs.color,u:mx(a.u,b.u),created:a.created<b.created?a.created:b.created,dates,dx};
 });
 const diary={},dm={};
 new Set([...Object.keys(A.diary),...Object.keys(B.diary),...Object.keys(A.dm),...Object.keys(B.dm)]).forEach(k=>{
  const ta=A.dm[k]||0,tb=B.dm[k]||0,w=ta>=tb?A:B,o=w===A?B:A,t=Math.max(ta,tb),x=w.diary[k]||(t?'':(o.diary[k]||''));
  if(t)dm[k]=t;if(x)diary[k]=x;
 });
 return{habits,diary,dm,del,user:nw.user,theme:A.theme,mt:mx(A.mt,B.mt),om:mx(A.om,B.om)};
}
// </merge>

function exportar(){
 const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='habitos-respaldo-'+key(today())+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importar(inp){
 const f=inp.files[0];if(!f)return;
 f.text().then(t=>{
  let j;try{j=JSON.parse(t)}catch(e){return alert('El archivo no es un JSON válido.')}
  if(!valid(j))return alert('El archivo no parece un respaldo de esta app.');
  if(!confirm('Se combinará con tus datos actuales; no se borra nada. ¿Continuar?'))return;
  S=merge(S,norm(j));save();view();
 });
 inp.value='';
}

function tc(){return TC||(TC=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
 callback:r=>{const p=pend;pend=null;if(!p)return;if(r.error)p.rej(r);else{TOK=r.access_token;TEXP=Date.now()+(r.expires_in||3600)*1000;p.res(TOK)}},
 error_callback:e=>{const p=pend;pend=null;if(p)p.rej(e)}}))}
function token(inter){
 return new Promise((res,rej)=>{
  if(TOK&&Date.now()<TEXP-60000)return res(TOK);
  if(!window.google||!google.accounts)return rej({error:'offline'});
  const p={res,rej};pend=p;
  setTimeout(()=>{if(pend===p){pend=null;rej({error:'timeout'})}},inter?180000:10000);
  tc().requestAccessToken({prompt:inter?'':'none'});
 });
}
async function gf(url,o={}){
 const r=await fetch(url,{...o,headers:{Authorization:'Bearer '+TOK,...(o.headers||{})}});
 if(r.status===401){TOK=null;throw{error:'auth'}}
 if(!r.ok)throw{error:'http',status:r.status};
 return r;
}
function errMsg(e){
 if(e instanceof TypeError)return'Sin conexión a internet.';
 const c=e&&(e.error||e.type);
 if(c==='offline')return'No se pudo cargar Google. Revisa tu conexión.';
 if(c==='access_denied')return'Permiso denegado en Google.';
 if(c==='http')return e.status===403?'Drive rechazó la petición: revisa que la API de Google Drive esté habilitada.':'Error de Drive ('+e.status+').';
 return conn()?'Sesión de Google caducada: ve a Ajustes y pulsa “Sincronizar ahora”.':'No se completó la conexión con Google.';
}
// inter=true solo desde un clic (abre la ventana de Google); false = intento silencioso
async function sync(inter){
 if(!CLIENT_ID){setSS('Falta el ID de cliente de Google.',true);return}
 if(busy){again=true;return}
 busy=true;setSS('Sincronizando…');
 try{
  await token(inter);
  const q=encodeURIComponent("name='"+FN+"' and trashed=false");
  const l=await(await gf(GAPI+'drive/v3/files?spaces=appDataFolder&orderBy=createdTime&fields=files(id)&q='+q)).json();
  const id=l.files&&l.files[0]&&l.files[0].id;
  let R=null;
  if(id){const j=await(await gf(GAPI+'drive/v3/files/'+id+'?alt=media')).json();if(valid(j))R=norm(j)}
  const snap=JSON.stringify(S),M=R?merge(S,R):S,out=JSON.stringify(M);
  if(!R||out!==JSON.stringify(R)){
   if(id)await gf(GAPI+'upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:out});
   else{
    const bd='hab'+Date.now();
    await gf(GAPI+'upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},
     body:'--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:FN,parents:['appDataFolder']})+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+out+'\r\n--'+bd+'--'});
   }
  }
  if(JSON.stringify(S)!==snap)again=true;
  else if(out!==snap){S=M;persist();if(!/INPUT|TEXTAREA/.test(document.activeElement.tagName))view()}
  localStorage.setItem('habitos_drive','1');lastSync=Date.now();
  setSS('Sincronizado ✓ '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setSS(errMsg(e),true)}
 finally{busy=false;if(again){again=false;sync(false)}}
}
function push(){if(!conn()||!CLIENT_ID)return;clearTimeout(timer);timer=setTimeout(()=>sync(false),2500)}
function desconectar(){
 localStorage.removeItem('habitos_drive');
 if(TOK&&window.google)try{google.accounts.oauth2.revoke(TOK)}catch(e){}
 TOK=null;setSS('');view();
}
window.gsiReady=()=>{if(conn())sync(false)};
if(window.google&&google.accounts)gsiReady();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&conn()&&Date.now()-lastSync>20000)sync(false)});

addEventListener('hashchange',view);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
view();
</script>
